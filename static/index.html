<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Article → Podcast</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #12100D;
    --panel: #1B1815;
    --paper: #F2EDE4;
    --amber: #E7A33D;
    --amber-dim: #9C7328;
    --wire: #3A342C;
    --mono: 'IBM Plex Mono', monospace;
    --display: 'Space Grotesk', sans-serif;
    --body: 'Inter', sans-serif;
  }
  * { box-sizing: border-box; }
  html,body{ margin:0; padding:0; }
  body{
    background: var(--bg);
    color: var(--paper);
    font-family: var(--body);
    min-height: 100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding: 32px 16px;
    background-image:
      radial-gradient(circle at 20% -10%, rgba(231,163,61,0.08), transparent 40%),
      radial-gradient(circle at 90% 110%, rgba(231,163,61,0.05), transparent 40%);
  }
  .console{ width: 100%; max-width: 640px; }
  .eyebrow{
    font-family: var(--mono);
    font-size: 12px;
    letter-spacing: 0.18em;
    color: var(--amber-dim);
    text-transform: uppercase;
    margin-bottom: 10px;
  }
  h1{
    font-family: var(--display);
    font-weight: 700;
    font-size: clamp(32px, 5vw, 44px);
    line-height: 1.05;
    margin: 0 0 8px;
    letter-spacing: -0.01em;
  }
  h1 span{ color: var(--amber); }
  .sub{
    color: #A69C8C;
    font-size: 15px;
    margin: 0 0 24px;
    max-width: 46ch;
  }
  .dial{
    display:flex;
    gap: 10px;
    background: var(--panel);
    border: 1px solid var(--wire);
    border-radius: 14px;
    padding: 10px;
  }
  .dial input{
    flex:1;
    background: transparent;
    border: none;
    outline: none;
    color: var(--paper);
    font-family: var(--mono);
    font-size: 14px;
    padding: 12px 10px;
  }
  .dial input::placeholder{ color: #6B6459; }
  .tap{
    background: var(--amber);
    color: #1B1400;
    border: none;
    border-radius: 9px;
    font-family: var(--display);
    font-weight: 600;
    font-size: 14px;
    padding: 0 22px;
    cursor: pointer;
    transition: transform 0.12s ease, background 0.12s ease;
    display:flex;
    align-items:center;
    gap:8px;
  }
  .tap:hover{ background:#f0b354; }
  .tap:active{ transform: scale(0.97); }
  .tap:disabled{ opacity: 0.5; cursor: default; transform:none; }

  .voice-toggle{
    display:none;
    align-items:center;
    gap: 8px;
    margin-top: 14px;
    font-family: var(--mono);
    font-size: 12px;
    color: #A69C8C;
  }
  .voice-toggle.on{ display:flex; }
  .voice-toggle input{ accent-color: var(--amber); width:14px; height:14px; }
  .voice-toggle .badge{
    font-size: 10px;
    color: var(--amber-dim);
    border: 1px solid var(--amber-dim);
    border-radius: 5px;
    padding: 1px 6px;
    letter-spacing: 0.06em;
  }

  .status{
    font-family: var(--mono);
    font-size: 12px;
    color: var(--amber-dim);
    margin-top: 14px;
    min-height: 18px;
    letter-spacing: 0.04em;
  }
  .error{ color: #D9724A; }
  .notice{ color: var(--amber-dim); }

  .wave{
    display:none;
    align-items:flex-end;
    gap: 3px;
    height: 22px;
    margin-top: 14px;
  }
  .wave.on{ display:flex; }
  .wave i{
    width: 3px;
    background: var(--amber);
    border-radius: 2px;
    animation: bounce 1.1s ease-in-out infinite;
  }
  .wave i:nth-child(1){ animation-delay: 0s; }
  .wave i:nth-child(2){ animation-delay: 0.1s; }
  .wave i:nth-child(3){ animation-delay: 0.2s; }
  .wave i:nth-child(4){ animation-delay: 0.3s; }
  .wave i:nth-child(5){ animation-delay: 0.4s; }
  .wave i:nth-child(6){ animation-delay: 0.5s; }
  .wave i:nth-child(7){ animation-delay: 0.6s; }
  @keyframes bounce{
    0%, 100% { height: 4px; }
    50% { height: 22px; }
  }

  .result{
    display:none;
    margin-top: 34px;
    border-top: 1px solid var(--wire);
    padding-top: 26px;
  }
  .result.on{ display:block; }
  .result .kicker{
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--amber-dim);
    margin-bottom: 6px;
    display:flex;
    align-items:center;
    gap: 8px;
  }
  .result .kicker .engine-pill{
    border: 1px solid var(--amber-dim);
    border-radius: 5px;
    padding: 1px 6px;
    font-size: 10px;
    color: var(--amber);
  }
  .result h2{
    font-family: var(--display);
    font-size: 22px;
    margin: 0 0 18px;
    line-height:1.2;
  }
  audio{
    width: 100%;
    height: 42px;
    margin-bottom: 18px;
    filter: invert(1) sepia(0.2) saturate(2) hue-rotate(360deg);
  }
  .actions{ display:flex; gap: 10px; margin-bottom: 22px; }
  .actions a{
    font-family: var(--mono);
    font-size: 12px;
    color: var(--amber);
    text-decoration: none;
    border: 1px solid var(--amber-dim);
    padding: 8px 14px;
    border-radius: 8px;
  }
  .actions a:hover{ background: rgba(231,163,61,0.08); }
  details{
    font-family: var(--body);
    color: #C9C0B2;
    font-size: 14px;
    line-height: 1.6;
  }
  details summary{
    cursor: pointer;
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: #8A8172;
  }
  .script-text{ margin-top: 12px; white-space: pre-wrap; }
</style>
</head>
<body>
  <div class="console">
    <div class="eyebrow">Article → Podcast</div>
    <h1>Tap a link,<br/><span>hear it back.</span></h1>
    <p class="sub">Paste any blog or article URL. It gets read, distilled into a spoken script, and voiced — a few minutes of listening instead of a long read.</p>

    <div class="dial">
      <input id="url" type="text" placeholder="https://example.com/some-article" />
      <button class="tap" id="tapBtn" onclick="generate()">▶ Tap</button>
    </div>

    <label class="voice-toggle" id="voiceToggle">
      <input type="checkbox" id="premiumVoice" />
      <span>Use premium voice</span>
      <span class="badge">ElevenLabs</span>
    </label>

    <div class="wave" id="wave"><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
    <div class="status" id="status"></div>

    <div class="result" id="result">
      <div class="kicker">
        <span>Now playing</span>
        <span class="engine-pill" id="enginePill"></span>
      </div>
      <h2 id="titleOut"></h2>
      <audio id="player" controls></audio>
      <div class="actions">
        <a id="downloadLink" download>Download mp3</a>
      </div>
      <details>
        <summary>Show script</summary>
        <div class="script-text" id="scriptOut"></div>
      </details>
    </div>
  </div>

<script>
const stages = [
  "reading the page…",
  "pulling out the article…",
  "writing the script…",
  "recording narration…"
];

// Only show the premium-voice toggle if the server has an ElevenLabs key configured.
fetch('/config').then(r => r.json()).then(cfg => {
  if (cfg.elevenlabs_available) {
    document.getElementById('voiceToggle').classList.add('on');
  }
}).catch(() => {});

async function generate() {
  const url = document.getElementById('url').value.trim();
  const premium = document.getElementById('premiumVoice').checked;
  const btn = document.getElementById('tapBtn');
  const status = document.getElementById('status');
  const wave = document.getElementById('wave');
  const result = document.getElementById('result');

  if (!url) {
    status.textContent = "Paste a URL first.";
    status.className = "status error";
    return;
  }

  btn.disabled = true;
  result.classList.remove('on');
  wave.classList.add('on');
  status.className = "status";

  let i = 0;
  status.textContent = stages[0];
  const stageTimer = setInterval(() => {
    i = Math.min(i + 1, stages.length - 1);
    status.textContent = stages[i];
  }, 3500);

  try {
    const res = await fetch('/generate', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ url, premium_voice: premium })
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.detail || 'Something went wrong.');

    document.getElementById('titleOut').textContent = data.title;
    document.getElementById('scriptOut').textContent = data.script;
    document.getElementById('enginePill').textContent =
      data.voice_engine === 'elevenlabs' ? 'ElevenLabs' : 'edge-tts';
    const player = document.getElementById('player');
    player.src = data.audio_url;
    document.getElementById('downloadLink').href = data.audio_url;

    result.classList.add('on');
    status.textContent = data.notice ? data.notice : "done.";
    status.className = data.notice ? "status notice" : "status";
  } catch (err) {
    status.textContent = err.message;
    status.className = "status error";
  } finally {
    clearInterval(stageTimer);
    wave.classList.remove('on');
    btn.disabled = false;
  }
}

document.getElementById('url').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') generate();
});
</script>
</body>
</html>
